# Proteção da V6: transações Kafka (read-process-write). O evento de saída é enviado dentro da transação
# do container, junto com o offset consumido, no lugar da outbox (a gravação no banco continua separada).
app.protecao.transacoes=true
app.protecao.outbox=false
spring.kafka.producer.transaction-id-prefix=estoque-tx-
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.listener.ack-mode=record
