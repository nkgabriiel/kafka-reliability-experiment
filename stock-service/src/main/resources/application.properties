spring.application.name=stock-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/tcc_pedidos?currentSchema=estoque
spring.datasource.username=tcc
spring.datasource.password=tcc

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.type.mapping=estoque-processado:br.com.gabriel.pedidoeventos.stock_service.evento.EstoqueProcessadoEvent

spring.kafka.consumer.group-id=stock-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=pagamento-processado:br.com.gabriel.pedidoeventos.stock_service.evento.PagamentoProcessadoEvent

app.topico.pagamentos-processados=pagamentos.processados
app.topico.estoque-processado=estoque.processado
logging.pattern.correlation=[pedidoId=%X{pedidoId}]
# outbox: intervalo do poller que publica os eventos pendentes no Kafka
app.outbox.intervalo-ms=500
app.outbox.atraso-inicial-ms=0

# retry bloqueante com backoff exponencial e jitter; esgotado, a mensagem vai para <topico>.dlq
app.retry.max-retentativas=3
app.retry.intervalo-inicial-ms=500
app.retry.multiplicador=2.0
app.retry.intervalo-maximo-ms=10000
app.retry.jitter-ms=200
