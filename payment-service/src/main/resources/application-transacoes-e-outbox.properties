# Variante V6b: transações Kafka somadas à outbox (a V6 cumulativa). Ao contrário do profile transacoes, a outbox
# continua ligada, então o evento de saída segue gravado no banco, na mesma transação do efeito.
app.protecao.transacoes=true
spring.kafka.producer.transaction-id-prefix=pagamento-tx-
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.listener.ack-mode=record
