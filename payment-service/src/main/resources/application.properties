spring.application.name=payment-service

# Versão do experimento (v1 a v6), escolhida por APP_VERSAO. Cada versão é um grupo de profiles, um por proteção;
# sem APP_VERSAO, roda a v5 (a configuração mais completa até a Fase 7).
spring.profiles.active=${APP_VERSAO:v5}
spring.profiles.group.v2=producer-idempotente
spring.profiles.group.v3=producer-idempotente,dedupe
spring.profiles.group.v4=producer-idempotente,dedupe,outbox
spring.profiles.group.v5=producer-idempotente,dedupe,outbox,retry-dlq
# variante v5b: a V5 mais o cancelamento do pedido cuja mensagem foi para a DLQ
spring.profiles.group.v5b=producer-idempotente,dedupe,outbox,retry-dlq,dlq-cancela
spring.profiles.group.v6=producer-idempotente,dedupe,outbox,retry-dlq,transacoes

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/tcc_pedidos?currentSchema=pagamento
spring.datasource.username=tcc
spring.datasource.password=tcc

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# V1: sem proteção no producer; a V2 liga a idempotência pelo profile producer-idempotente
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.spring.json.type.mapping=pagamento-processado:br.com.gabriel.pedidoeventos.payment_service.evento.PagamentoProcessadoEvent

spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=pedido-criado:br.com.gabriel.pedidoeventos.payment_service.evento.PedidoCriadoEvent
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.properties.session.timeout.ms=${APP_KAFKA_SESSION_TIMEOUT_MS:45000}
spring.kafka.consumer.properties.heartbeat.interval.ms=${APP_KAFKA_HEARTBEAT_MS:3000}

pagamento.mock.limite-aprovacao=10000

app.topico.pedidos-criados=pedidos.criados
app.topico.pagamentos-processados=pagamentos.processados
logging.pattern.correlation=[pedidoId=%X{pedidoId}] 

app.demo.atraso-ack-ms=0
# outbox: intervalo do poller que publica os eventos pendentes no Kafka
app.outbox.intervalo-ms=500

# retry bloqueante com backoff exponencial e jitter; esgotado, a mensagem vai para <topico>.dlq
app.retry.max-retentativas=3
app.retry.intervalo-inicial-ms=500
app.retry.multiplicador=2.0
app.retry.intervalo-maximo-ms=10000
app.retry.jitter-ms=200

# produtoId que faz o processamento falhar sempre (poison message simulada); vazio = desligado
app.demo.produto-envenenado=

# Proteções do experimento: todas desligadas por padrão (v1); cada profile de versão liga as suas
app.protecao.dedupe=false
app.protecao.outbox=false
app.protecao.retry-dlq=false

# falha aleatória simulada no payment-service: percentual das chamadas que lançam exceção (0 = desligado)
app.demo.taxa-falha=0
