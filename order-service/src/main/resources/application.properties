spring.application.name=order-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/tcc_pedidos?currentSchema=pedido
spring.datasource.username=tcc
spring.datasource.password=tcc

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.spring.json.type.mapping=pedido-criado:br.com.gabriel.pedidoeventos.order_service.evento.PedidoCriadoEvent

spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=pagamento-processado:br.com.gabriel.pedidoeventos.order_service.evento.PagamentoProcessadoEvent,estoque-processado:br.com.gabriel.pedidoeventos.order_service.evento.EstoqueProcessadoEvent

app.topico.pedidos-criados=pedidos.criados
app.topico.pagamentos-processados=pagamentos.processados
app.topico.estoque-processado=estoque.processado
logging.pattern.correlation=[pedidoId=%X{pedidoId}] 