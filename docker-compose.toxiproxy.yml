# Camada de injeção de falha de rede (Fase 9). Acrescenta um Toxiproxy entre os serviços e o Kafka/Postgres.
# Por padrão nada muda: os serviços continuam falando direto com kafka:9092 e postgres:5432. Só quando a
# bateria define KAFKA_BOOTSTRAP=toxiproxy:19092 e/ou DB_HOSTPORT=toxiproxy:15432 o tráfego passa pelo proxy,
# e então ela injeta latência ou partição pela API do Toxiproxy (porta 8474).
#
# Uso (a bateria já faz isso): docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                                             -f docker-compose.toxiproxy.yml up -d
services:
  kafka:
    environment:
      # listener extra, anunciado com o endereço do proxy, para os clientes que entram por ele continuarem nele
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092,PROXIED://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092,PROXIED://toxiproxy:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PROXIED:PLAINTEXT

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    container_name: toxiproxy
    ports:
      - "8474:8474"
    networks:
      - tcc-network

  order-service:
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:9092}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOSTPORT:-postgres:5432}/tcc_pedidos?currentSchema=pedido

  payment-service:
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:9092}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOSTPORT:-postgres:5432}/tcc_pedidos?currentSchema=pagamento

  stock-service:
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:9092}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOSTPORT:-postgres:5432}/tcc_pedidos?currentSchema=estoque
